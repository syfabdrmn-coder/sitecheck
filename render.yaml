databases:
  - name: sitecheck-db-scq
    databaseeName: sitecheck
    user: sitecheck
    plan: free  
    region: singapore

services:
  - type: web
    name: sitecheck-backend-scq
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sitecheck-db-scq
          property: connectionString
      - key: CLIENT_URL
        value: http://sitecheck-frontend-scq.onrender.com

  - type: web
    name: sitecheck-frontend-scq
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: http://sitecheck-backend-scq.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
       